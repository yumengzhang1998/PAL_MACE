# MACE
args_dict: {
    "name": "MACE_on_bi14-6_samples",
    "num_workers": 16,
    "train_file": "train.xyz",
    "valid_file": "test.xyz",
    "test_file": "test.xyz",
    "results_dir": "results",
    "E0s": "average",
    "statistics_file": None,
    "model": "MACE_with_charge",
    "num_interactions": 2,
    "num_channels": 128,
    "max_L": 1,
    "r_max": 9.0,
    "patience": 20,
    "correlation": 3,
    "batch_size": 32,
    "valid_batch_size": 32,
    "max_num_epochs": 200,
    "swa": False,
    "ema": True,
    "ema_decay": 0.99,
    "amsgrad": True,
    "error_table": "TotalMAE",
    "device": "cpu",
    "seed": 123
}

# time
time_stamp: bi14-6_samples_20260723_163806

# MD settings
num_traj_per_gene: 20
max_steps_per_traj: 1000000
save_gene_traj: True
gene_temperature_low: 298.0
gene_temperature_high: 700.0

# Retraining settings
load_model: False
load_dataset: False
starting_pool_update: True
pool_csv: "starting_point_pool.csv"

# active learning
patience_threshold: 10

num_pred_process: 2
num_orcl_process: 50
num_gen_process: 3
retrain_size: 50

full_dataset: False
use_pretrain_reference: True
reference_sources: ["usr/pretrain/samples/bi14-6_samples/sample_0/train.csv", "usr/pretrain/samples/bi14-6_samples/sample_1/train.csv"]
reference_model_indices: [0, 1]

prefix: bi14-6_samples
energy_threshold: -81777.5546875
energy_std_threshold: 0.08466284377291805
force_atom_max_std: 0.2038894620635776
force_rms_std: 0.06296137950579554
bound: 10
hard_bound: 1.1015625
soft_bound: 0.55078125
num_atom: 14
coord: null
max_dist: 20.217319855924597
source: {"real": 0, "synthesis_bi4": 1, "synthesis_bi2": 2}
metadata:
  - { name: coords,          type: array,  shape: [14, 3], dtype: float64 }
  - { name: atomic_numbers,  type: tensor,   shape: [14],    dtype: torch.int64}  # or tensor with int dtype
  - { name: energy,          type: scalar_nullable,        dtype: float  }  # was None OK too
  - { name: forces,          type: array,  shape: [14, 3], dtype: float64 }
  - { name: charge,          type: charge,                 dtype: torch.long}                                 # 1 scalar int
  - { name: pred_forces,     type: array,  shape: [14, 3], dtype: float64 } # ← this one commonly mis-set
  - { name: pred_energy,     type: scalar_nullable,        dtype: float  }
  - { name: patience,        type: list,   shape: [2]    , dtype: int }  # must be BEFORE velocities
  - { name: velocities,      type: array,  shape: [14, 3], dtype: float64 }

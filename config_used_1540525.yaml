# MACE
args_dict: {
    "name": "MACE_on_bi7-3",
    "num_workers": 16,
    "train_file": "train.xyz",
    "valid_file": "test.xyz",
    "test_file": "test.xyz",
    "results_dir": "results",
    "E0s": "average",
    "statistics_file": None,
    "model": "MACE_with_charge",
    "num_interactions": 2,
    "num_channels": 128,
    "max_L": 1,
    "r_max": 9.0,
    "patience": 20,
    "correlation": 3,
    "batch_size": 32,
    "valid_batch_size": 32,
    "max_num_epochs": 200,
    "swa": False,
    "ema": True,
    "ema_decay": 0.99,
    "amsgrad": True,
    "error_table": "TotalMAE",
    "device": "cpu",
    "seed": 123
}

# active learning
patience_threshold: 10

num_pred_process: 2
num_orcl_process: 50
num_gen_process: 2
retrain_size: 50

full_dataset: True

prefix: bi7-3
energy_threshold: -40889.9
std_threshold: 0.001
bound: 10
num_atom: 7
coord: [[12.107382, 20.427849, 15.591037], [9.05425, 16.972709, 14.456912], [7.482569, 19.369172, 15.539199], [9.927956, 19.827859, 13.749094], [11.26327, 18.816737, 17.944442], [10.817831, 16.180775, 16.63898], [8.457586, 19.74407, 18.260679]]
max_dist: 4.748247

metadata:
  - { name: coords,          type: array,  shape: [7, 3], dtype: float64 }
  - { name: atomic_numbers,  type: tensor,   shape: [7],    dtype: torch.int64}  # or tensor with int dtype
  - { name: energy,          type: scalar_nullable,        dtype: float  }  # was None OK too
  - { name: forces,          type: array,  shape: [7, 3], dtype: float64 }
  - { name: charge,          type: charge,                 dtype: torch.long}                                 # 1 scalar int
  - { name: pred_forces,     type: array,  shape: [7, 3], dtype: float64 } # ← this one commonly mis-set
  - { name: pred_energy,     type: scalar_nullable,        dtype: float  }
  - { name: patience,        type: list,   shape: [2]    , dtype: int }  # must be BEFORE velocities
  - { name: velocities,      type: array,  shape: [7, 3], dtype: float64 }

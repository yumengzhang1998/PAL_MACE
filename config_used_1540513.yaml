# MACE
args_dict: {
    "name": "MACE_on_bi4-6",
    "num_workers": 16,
    "train_file": "train.xyz",
    "valid_file": "test.xyz",
    "test_file": "test.xyz",
    "results_dir": "results",
    "E0s": "average",
    "statistics_file": None,
    "model": "MACE_with_charge",
    "num_interactions": 2,
    "num_channels": 128,
    "max_L": 1,
    "r_max": 9.0,
    "patience": 20,
    "correlation": 3,
    "batch_size": 32,
    "valid_batch_size": 32,
    "max_num_epochs": 200,
    "swa": False,
    "ema": True,
    "ema_decay": 0.99,
    "amsgrad": True,
    "error_table": "TotalMAE",
    "device": "cpu",
    "seed": 123
}

# active learning
patience_threshold: 10

num_pred_process: 2
num_orcl_process: 50
num_gen_process: 2
retrain_size: 50

full_dataset: True

prefix: bi4-6
energy_threshold: -23374.0
std_threshold: 0.02
bound: 10
num_atom: 4
coord: [[0.306222, 0.246304, 0.000557], [3.384802, 0.022096, -0.000556], [3.834552, 3.010301, -0.000558], [6.911945, 2.777742, 0.000557]]
max_dist: 7.074161

metadata:
  - { name: coords,          type: array,  shape: [4, 3], dtype: float64 }
  - { name: atomic_numbers,  type: tensor,   shape: [4],    dtype: torch.int64}  # or tensor with int dtype
  - { name: energy,          type: scalar_nullable,        dtype: float  }  # was None OK too
  - { name: forces,          type: array,  shape: [4, 3], dtype: float64 }
  - { name: charge,          type: charge,                 dtype: torch.long}                                 # 1 scalar int
  - { name: pred_forces,     type: array,  shape: [4, 3], dtype: float64 } # ← this one commonly mis-set
  - { name: pred_energy,     type: scalar_nullable,        dtype: float  }
  - { name: patience,        type: list,   shape: [2]    , dtype: int }  # must be BEFORE velocities
  - { name: velocities,      type: array,  shape: [4, 3], dtype: float64 }
